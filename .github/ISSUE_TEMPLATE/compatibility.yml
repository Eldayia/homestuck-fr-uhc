name: Compatibilité UHC
description: Signaler un problème testé dans l'application UHC
title: "[Compatibilité] "
labels: [compatibility]
body:
  - type: input
    id: uhc_version
    attributes:
      label: Version UHC
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Système et version
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Type d'installation
      options: [installation neuve, mise à jour d'un mod existant]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Comportement technique
      description: Décrire le rendu sans recopier le texte de la page.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Vérification
      options:
        - label: Les journaux et pièces jointes ne contiennent aucun corpus, asset ou donnée privée.
          required: true
