name: Release guard

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mode-b-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:build
      - run: npm run release:test
      - uses: actions/upload-artifact@v4
        with:
          name: homestuck-fr-uhc-tools-candidate
          path: .release/
          if-no-files-found: error
          include-hidden-files: true
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" .release/* --verify-tag --title "Homestuck FR UHC Tools ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
